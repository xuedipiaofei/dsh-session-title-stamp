<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#14161a;--panel:#1b1d22;--stroke:#2e323a;--text:#eceef2;--muted:#9aa0aa;--dim:#6e7480;--brand:#6f96ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(900px 500px at 20% 0%,#232a3b 0%,transparent 60%),var(--bg);color:var(--text);font-family:"PingFang SC","SF Pro Display","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px}
.panel{position:relative;width:1148px;height:700px;background:var(--panel);border:1px solid var(--stroke);border-radius:18px;box-shadow:0 24px 70px #0007;display:flex;flex-direction:column}
.top{height:210px;display:flex;align-items:center;gap:16px;padding:0 26px;border-bottom:1px solid var(--stroke);background:#191b20;border-radius:18px 18px 0 0}
.back{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--dim);font-size:30px}
.titles{display:flex;flex-direction:column;gap:8px;min-width:0}
.title{font-size:34px;font-weight:500;color:#fff;letter-spacing:.01em;white-space:nowrap}
.sub{font-size:14px;color:var(--dim)}
.spacer{flex:1}
.regen{position:relative;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:40px;background:#39508a;border:1px solid var(--brand);box-shadow:0 0 0 6px #6f96ff26,0 14px 34px #0008}
.cursor{position:absolute;right:-10px;bottom:-12px;filter:drop-shadow(0 3px 6px #000b)}
.tip{position:absolute;right:120px;top:196px;background:#33405c;border:1px solid #5a76b8;border-radius:11px;padding:10px 15px;font-size:17px;color:#f2f6ff;box-shadow:0 16px 38px #000a;white-space:nowrap;z-index:4}
.tip:before{content:"";position:absolute;top:-6px;right:28px;width:11px;height:11px;background:#33405c;border-left:1px solid #5a76b8;border-top:1px solid #5a76b8;transform:rotate(45deg)}
.body{flex:1;padding:26px 38px;display:flex;flex-direction:column;gap:20px;overflow:hidden;opacity:.4;-webkit-mask-image:linear-gradient(#000 68%,transparent 100%);mask-image:linear-gradient(#000 68%,transparent 100%)}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .av{width:26px;height:26px;border-radius:50%;background:#2e3440;flex:none;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:11px;flex:1;padding-top:4px}
.bar{height:12px;border-radius:6px;background:#2a2f38}
.b70{width:70%}.b62{width:62%}.b54{width:54%}.b44{width:44%}.b32{width:32%}
.msg.user{justify-content:flex-end}
.bub{width:330px;background:#2c3a57;border:1px solid #3d5480;border-radius:12px;padding:15px 17px}
.bub .bar{background:#5b76a8}
.cap{color:#6b7280;font-size:15px;letter-spacing:.01em}
</style></head><body>
<div class="panel">
  <div class="top">
    <div class="back">‹</div>
    <div class="titles">
      <div class="title">1027 | 修复 | 排查登录接口 401</div>
      <div class="sub">2 分钟前 · 会话头</div>
    </div>
    <div class="spacer"></div>
    <div class="regen">↻
      <svg class="cursor" width="26" height="26" viewBox="0 0 24 24"><path d="M5 3l14 9-6.2.7 3.6 6.4-2.7 1.5-3.6-6.5L5 18.5z" fill="#fff" stroke="#101318" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div class="tip">重新生成标题</div>
  <div class="body">
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b62"></div><div class="bar b44"></div><div class="bar b32"></div></div></div>
    <div class="msg user"><div class="bub"><div class="bar"></div></div></div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b54"></div><div class="bar b32"></div></div></div>
    <div class="msg user"><div class="bub"><div class="bar"></div></div></div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b62"></div><div class="bar b44"></div><div class="bar b32"></div></div></div>
  </div>
</div>
<div class="cap">点会话头 ↻，就地重新生成标题，不弹窗</div>
</body></html>
