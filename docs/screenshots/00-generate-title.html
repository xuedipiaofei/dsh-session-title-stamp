<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#14161a;--panel:#1b1d22;--stroke:#2e323a;--text:#eceef2;--muted:#9aa0aa;--dim:#6e7480;--brand:#6f96ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(900px 500px at 20% 0%,#232a3b 0%,transparent 60%),var(--bg);color:var(--text);font-family:"PingFang SC","SF Pro Display","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.panel{position:relative;width:1148px;height:640px;background:var(--panel);border:1px solid var(--stroke);border-radius:16px;box-shadow:0 24px 70px #0007;display:flex;flex-direction:column}
.top{height:72px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--stroke);background:#191b20;border-radius:16px 16px 0 0}
.back{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim);font-size:20px}
.title{font-size:18px;font-weight:500;color:#fff;letter-spacing:.01em}
.spacer{flex:1}
.icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:17px}
.regen{position:relative;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:19px;background:#39508a;border:1px solid var(--brand);box-shadow:0 0 0 4px #6f96ff26,0 10px 24px #0007}
.cursor{position:absolute;right:-6px;bottom:-8px;filter:drop-shadow(0 2px 4px #000a)}
.tip{position:absolute;right:80px;top:64px;background:#33405c;border:1px solid #5a76b8;border-radius:9px;padding:8px 12px;font-size:13px;color:#eef2fa;box-shadow:0 14px 34px #0009;white-space:nowrap;z-index:4}
.tip:before{content:"";position:absolute;top:-5px;right:24px;width:9px;height:9px;background:#33405c;border-left:1px solid #5a76b8;border-top:1px solid #5a76b8;transform:rotate(45deg)}
.body{flex:1;padding:22px 32px;display:flex;flex-direction:column;gap:15px;overflow:hidden;opacity:.62;-webkit-mask-image:linear-gradient(#000 76%,transparent 100%);mask-image:linear-gradient(#000 76%,transparent 100%)}
.meta{color:var(--dim);font-size:12px}
.msg{display:flex;gap:11px;align-items:flex-start}
.msg .av{width:22px;height:22px;border-radius:50%;background:#2e3440;flex:none;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:9px;flex:1;padding-top:3px}
.bar{height:9px;border-radius:5px;background:#2a2f38}
.b70{width:70%}.b62{width:62%}.b54{width:54%}.b44{width:44%}.b32{width:32%}
.msg.user{justify-content:flex-end}
.bub{width:270px;background:#2c3a57;border:1px solid #3d5480;border-radius:10px;padding:11px 13px}
.bub .bar{background:#5b76a8}
.composer{margin:0 24px 20px;height:52px;border:1px solid #343a45;border-radius:12px;background:#20242b;display:flex;align-items:center;padding:0 16px;color:#6e7480;font-size:13px}
.cap{color:#6b7280;font-size:12px;letter-spacing:.01em}
</style></head><body>
<div class="panel">
  <div class="top">
    <div class="back">‹</div>
    <div class="title">1027 | 修复 | 排查登录接口 401</div>
    <div class="spacer"></div>
    <div class="icon">⋯</div>
    <div class="regen">↻
      <svg class="cursor" width="20" height="20" viewBox="0 0 24 24"><path d="M5 3l14 9-6.2.7 3.6 6.4-2.7 1.5-3.6-6.5L5 18.5z" fill="#fff" stroke="#101318" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div class="tip">重新生成标题</div>
  <div class="body">
    <div class="meta">2 分钟前 · 耗时 4h 54m · 估算 ≈¥11.59</div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b62"></div><div class="bar b44"></div><div class="bar b32"></div></div></div>
    <div class="msg user"><div class="bub"><div class="bar"></div></div></div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b54"></div><div class="bar b32"></div></div></div>
    <div class="msg user"><div class="bub"><div class="bar"></div></div></div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b62"></div><div class="bar b44"></div></div></div>
    <div class="msg user"><div class="bub"><div class="bar"></div></div></div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b62"></div><div class="bar b44"></div><div class="bar b32"></div></div></div>
    <div class="msg user"><div class="bub"><div class="bar"></div></div></div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b54"></div><div class="bar b32"></div></div></div>
    <div class="msg user"><div class="bub"><div class="bar"></div></div></div>
    <div class="msg"><div class="av"></div><div class="bars"><div class="bar b62"></div><div class="bar b44"></div></div></div>
  </div>
  <div class="composer">输入消息…</div>
</div>
<div class="cap">会话头 ↻ = 一键重新生成：就地重算，不弹窗</div>
</body></html>
